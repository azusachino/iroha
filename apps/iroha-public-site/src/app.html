<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A public, privacy-trimmed window into a personal activity archive."
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="theme-color" content="#0c1222" />
    <style>
      body {
        background-color: #0c1222;
        color: #e2e8f0;
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          sans-serif;
      }
      #public-bootstrap-status {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: -0.01em;
        color: #94a3b8;
      }
    </style>
    %sveltekit.head%
  </head>
  <body>
    <!-- Client-only SvelteKit waits for PageLoad before mounting the shell. -->
    <p id="public-bootstrap-status" role="status" aria-live="polite">
      Loading public activity data…
    </p>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
