<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A public, privacy-trimmed window into a personal activity archive."
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="theme-color" content="#0c1222" />
    %sveltekit.head%
  </head>
  <body>
    <!-- Client-only SvelteKit waits for PageLoad before mounting the shell. -->
    <p id="public-bootstrap-status" role="status" aria-live="polite">
      Loading public activity data…
    </p>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
