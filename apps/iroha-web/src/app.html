<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <link
      id="theme-favicon"
      rel="icon"
      href="/favicon.svg?v=3"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0c1222" />
    <script>
      // Apply saved visual modes before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem("iroha-theme");
          var isSystemLight = window.matchMedia(
            "(prefers-color-scheme: light)",
          ).matches;
          var t = "dark";
          if (pref === "light" || pref === "dark") {
            t = pref;
          } else {
            pref = "auto";
            t = isSystemLight ? "light" : "dark";
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.dataset.themePreference = pref;
          document.getElementById("theme-favicon").href =
            t === "light" ? "/favicon-light.svg?v=3" : "/favicon.svg?v=3";
          // Grapher is the only design language; drop any stored choice
          // from the retired languages.
          document.documentElement.dataset.language = "grapher";
          try {
            localStorage.removeItem("iroha-design-language");
          } catch (e) {}
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.themePreference = "auto";
          document.documentElement.dataset.language = "grapher";
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Client-only SvelteKit waits for PageLoad before mounting the shell. -->
    <p id="public-bootstrap-status" role="status" aria-live="polite">
      Loading public activity data…
    </p>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
