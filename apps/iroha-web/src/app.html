<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0c1222" />
    <script>
      // Apply saved visual modes before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("iroha-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.dataset.theme = t;
          var language = localStorage.getItem("iroha-design-language");
          var languages = [
            "atlas",
            "grapher",
            "field-journal",
            "phenology",
            "cadence",
            "archive",
          ];
          document.documentElement.dataset.language = languages.includes(
            language,
          )
            ? language
            : "grapher";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.language = "grapher";
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
