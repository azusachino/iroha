			<stop stop-color="#17233d" />
			<stop offset="1" stop-color="#0c1222" />
		</linearGradient>
		<linearGradient id="orbit" x1="16" y1="45" x2="49" y2="16" gradientUnits="userSpaceOnUse">
			<stop stop-color="#5c8dff" />
			<stop offset="1" stop-color="#d47bf0" />
