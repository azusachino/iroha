<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
	<title id="title">iroha</title>
	<desc id="desc">A four-petal data bloom on a warm light field</desc>
	<defs>
		<radialGradient id="halo-light" cx="0" cy="0" r="1" gradientTransform="translate(32 32) scale(24)">
			<stop stop-color="#076660" stop-opacity=".15" />
			<stop stop-color="#076660" stop-opacity="0" />
		</radialGradient>
	</defs>
	<!-- Container field matching BrandMark.svelte in light theme (--surface / --border) -->
	<rect width="64" height="64" rx="17" fill="#f7f6f2" stroke="#d5d3cb" stroke-width="1.5" />
	<!-- Subtle ambient glow -->
	<circle cx="32" cy="32" r="23" fill="url(#halo-light)" />
	<!-- Orbit boundary ring -->
	<circle cx="32" cy="32" r="21" fill="none" stroke="#222b38" stroke-opacity=".15" stroke-width="1.2" />
	<!-- Four data-bloom petals matching BrandMark.svelte in light mode -->
	<!-- North: Primary accent (--accent light) -->
	<path d="M32 31C25.5 27.3 23.9 20.1 26.7 13.8 28.3 10.2 31 8 32 8c1 0 3.7 2.2 5.3 5.8 2.8 6.3 1.2 13.5-5.3 17.2Z" fill="#076660" />
	<!-- East: Secondary accent (--accent-2 light) -->
	<path d="M33 32C36.7 25.5 43.9 23.9 50.2 26.7 53.8 28.3 56 31 56 32c0 1-2.2 3.7-5.8 5.3-6.3 2.8-13.5 1.2-17.2-5.3Z" fill="#be123c" />
	<!-- South: Tertiary accent (--mark-violet light) -->
	<path d="M32 33C38.5 36.7 40.1 43.9 37.3 50.2 35.7 53.8 33 56 32 56c-1 0-3.7-2.2-5.3-5.8-2.8-6.3-1.2-13.5 5.3-17.2Z" fill="#5b21b6" />
	<!-- West: Quaternary accent (--mark-amber light) -->
	<path d="M31 32C27.3 38.5 20.1 40.1 13.8 37.3 10.2 35.7 8 33 8 32c0-1 2.2-3.7 5.8-5.3 6.3-2.8 13.5-1.2 17.2 5.3Z" fill="#854d0e" />
	<!-- Central core hub -->
	<circle cx="32" cy="32" r="7.2" fill="#ffffff" stroke="#222b38" stroke-width="1.6" />
	<circle cx="32" cy="32" r="2.8" fill="#076660" />
</svg>
