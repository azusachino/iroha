name: iroha-dev

services:
  server:
    cpus: 1
    mem_limit: 512m
    build:
      context: ../..
      dockerfile: ops/images/Containerfile.server
      target: server
    environment:
      IROHA_SERVER_ADDR: 0.0.0.0:8080
      IROHA_DATABASE_URL: postgres://iroha:iroha_dev@db:5432/iroha?sslmode=disable
      IROHA_DATA_DIR: /data
      IROHA_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://harus-macmini:5173,http://harus-mini:5173
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ../../.iroha-data:/data

  job:
    cpus: 1
    mem_limit: 1g
    build:
      context: ../..
      dockerfile: ops/images/Containerfile.server
      target: job
    environment:
      IROHA_DATABASE_URL: postgres://iroha:iroha_dev@db:5432/iroha?sslmode=disable
      IROHA_DATA_DIR: /data
      IROHA_ANILIST_USERNAME: azusachino
      IROHA_BANGUMI_USERNAME: mikufan2039
    volumes:
      - ../../.iroha-data:/data
    depends_on:
      - db

  web:
    cpus: 1
    mem_limit: 256m
    build:
      context: ../..
      dockerfile: ops/images/Containerfile.web
      args:
        PUBLIC_IROHA_API_BASE: ""
    environment:
      IROHA_SERVER_UPSTREAM: server:8080
    ports:
      - "5173:80"
    depends_on:
      - server
