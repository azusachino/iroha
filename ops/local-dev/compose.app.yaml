name: iroha-dev

services:
  server:
    # Rootless Podman maps the host user to container root, so the bind-mounted
    # .iroha-data is not owned by the image's iroha user (100:101) and startup
    # fails to tighten raw-file modes. Map the host user to iroha instead.
    userns_mode: keep-id:uid=100,gid=101
    cpus: 1
    mem_limit: 512m
    build:
      context: ../..
      dockerfile: ops/images/Containerfile.server
      target: server
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unverified-development}
    environment:
      IROHA_SERVER_ADDR: 0.0.0.0:8080
      IROHA_TIMEZONE: ${IROHA_TIMEZONE:-Asia/Tokyo}
      IROHA_DATABASE_URL: postgres://iroha:iroha_dev@db:5432/iroha?sslmode=disable
      IROHA_DATA_DIR: /data
      IROHA_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://harus-macmini:5173,http://harus-mini:5173
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ../../.iroha-data:/data

  job:
    # Rootless Podman maps the host user to container root, so the bind-mounted
    # .iroha-data is not owned by the image's iroha user (100:101) and startup
    # fails to tighten raw-file modes. Map the host user to iroha instead.
    userns_mode: keep-id:uid=100,gid=101
    cpus: 1
    mem_limit: 1g
    build:
      context: ../..
      dockerfile: ops/images/Containerfile.server
      target: job
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unverified-development}
    environment:
      IROHA_DATABASE_URL: postgres://iroha:iroha_dev@db:5432/iroha?sslmode=disable
      IROHA_DATA_DIR: /data
      IROHA_ANILIST_USERNAME: azusachino
      IROHA_BANGUMI_USERNAME: mikufan2039
    volumes:
      - ../../.iroha-data:/data
    depends_on:
      - db

  web:
    cpus: 1
    mem_limit: 256m
    build:
      context: ../..
      dockerfile: ops/images/Containerfile.web
      args:
        PUBLIC_IROHA_API_BASE: ""
        SOURCE_REVISION: ${SOURCE_REVISION:-unverified-development}
        PUBLIC_IROHA_TIMEZONE: ${IROHA_TIMEZONE:-Asia/Tokyo}
    environment:
      IROHA_SERVER_UPSTREAM: server:8080
    ports:
      - "5173:8080"
    depends_on:
      - server
