name: iroha-dev

services:
  db:
    image: ghcr.io/baosystems/postgis:18-3.6
    cpus: 2
    mem_limit: 2g
    environment:
      POSTGRES_DB: iroha
      POSTGRES_USER: iroha
      POSTGRES_PASSWORD: iroha_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    cpus: 1
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data

volumes:
  pgdata:
  valkeydata:
