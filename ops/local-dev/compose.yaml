name: iroha-dev

services:
  db:
    # Parity with the cluster's postgis (k3s: mirror.gcr.io/postgis/postgis:18-3.6-alpine):
    # same upstream image and tag, so local findings match production and the
    # old kartoza image (25 CRITICALs at the 2026-11-13 audit) stays out of the
    # store. Standard postgres entrypoint variables.
    image: docker.io/postgis/postgis:18-3.6-alpine
    cpus: 2
    mem_limit: 2g
    environment:
      POSTGRES_DB: iroha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: iroha_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb/001-iroha-user.sql:/docker-entrypoint-initdb.d/001-iroha-user.sql

volumes:
  pgdata:
    # Fresh volume: the previous iroha-dev_pgdata-kartoza held throwaway dev
    # data under the kartoza layout; recreate rather than migrate.
    name: iroha-dev_pgdata
