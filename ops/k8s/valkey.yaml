apiVersion: v1
kind: Service
metadata:
  name: iroha-valkey
  labels:
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: iroha
spec:
  selector:
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: iroha
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iroha-valkey
  labels:
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: iroha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: cache
      app.kubernetes.io/part-of: iroha
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: iroha
    spec:
      automountServiceAccountToken: false
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          args: [valkey-server, --save, "", --appendonly, "no"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [valkey-cli, ping]
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 256Mi
