apiVersion: v1
kind: ConfigMap
metadata:
  name: iroha-config
  labels:
    app.kubernetes.io/part-of: iroha
data:
  IROHA_DATA_DIR: /data
  IROHA_TIMEZONE: Asia/Tokyo
  IROHA_SERVER_ADDR: 0.0.0.0:8080
  IROHA_CACHE_BACKEND: valkey
  IROHA_VALKEY_URL: redis://iroha-valkey:6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iroha-data
  labels:
    app.kubernetes.io/part-of: iroha
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: iroha-postgis
  labels:
    app.kubernetes.io/component: postgis
    app.kubernetes.io/part-of: iroha
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: postgis
    app.kubernetes.io/part-of: iroha
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iroha-postgis
  labels:
    app.kubernetes.io/component: postgis
    app.kubernetes.io/part-of: iroha
spec:
  serviceName: iroha-postgis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgis
      app.kubernetes.io/part-of: iroha
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgis
        app.kubernetes.io/part-of: iroha
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:18-3.6-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: iroha
            - name: POSTGRES_DB
              value: iroha
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iroha-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: [pg_isready, -U, iroha, -d, iroha]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, iroha, -d, iroha]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
