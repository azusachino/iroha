      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iroha-web
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: iroha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: iroha
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: iroha
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: iroha-web
          env:
            - name: IROHA_SERVER_UPSTREAM
              value: iroha-server:80
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: caddy-data
          emptyDir:
            sizeLimit: 64Mi
        - name: caddy-config
          emptyDir:
            sizeLimit: 16Mi
---
