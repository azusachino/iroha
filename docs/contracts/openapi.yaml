openapi: 3.1.0
info:
  title: Iroha API
  version: 0.4.1
  description: |
    Active-development contract for Iroha's private data cockpit.
    /api/v1 is still pre-1.0 and may evolve between minor releases. This
    document is the implementation target for release 0.4.1.
servers:
  - url: /
    description: Same-origin or reverse-proxy deployment
tags:
  - name: system
  - name: imports
  - name: activities
  - name: sleep
  - name: daily
  - name: metrics
  - name: expenses
  - name: media
  - name: control-room
paths:
  /healthz:
    get:
      tags: [system]
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      tags: [system]
      responses:
        "200":
          description: Server is ready to serve data.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
        "503":
          description: A required server dependency is unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: not_ready
  /api/v1/briefing:
    get:
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/Date"
      responses:
        "200":
          description: Day briefing with versioned sections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/metrics:
    get:
      tags: [metrics]
      summary: List the immutable metric catalog.
      responses:
        "200":
          description: Metric definitions and their aggregation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricCatalog"
  /api/v1/metrics/{metricId}:
    get:
      tags: [metrics]
      summary: Get one metric definition.
      parameters:
        - name: metricId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Metric definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricDefinitionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/metrics/{metricId}/series:
    get:
      tags: [metrics]
      summary: Return a complete server-aggregated metric series.
      parameters:
        - name: metricId
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Exclusive end date.
          schema: { type: string, format: date }
        - name: grain
          in: query
          required: true
          schema: { type: string, enum: [day, month, year] }
        - name: timezone
          in: query
          schema: { type: string, default: UTC }
      responses:
        "200":
          description: Complete metric series with explicit missingness and coverage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/raw-files:
    get:
      tags: [imports]
      responses:
        "200":
          description: Most recent raw files.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RawFile"
    post:
      tags: [imports]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_kind]
              properties:
                file:
                  type: string
                  format: binary
                source_kind:
                  $ref: "#/components/schemas/SourceKind"
                uploaded_via:
                  $ref: "#/components/schemas/UploadSource"
      responses:
        "201":
          description: Raw file stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawFile"
        "200":
          description: File content was already stored; duplicate is true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawFile"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/raw-files/{rawFileId}:
    get:
      tags: [imports]
      parameters:
        - $ref: "#/components/parameters/RawFileId"
      responses:
        "200":
          description: Raw file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/imports:
    get:
      tags: [imports]
      responses:
        "200":
          description: Most recent import jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportJob"
    post:
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImport"
      responses:
        "202":
          description: Import job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/imports/{importId}:
    get:
      tags: [imports]
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Import job status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/activities:
    get:
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: sport_type
          in: query
          schema: { type: string }
        - name: started_from
          in: query
          schema: { type: string, format: date-time }
        - name: started_to
          in: query
          schema: { type: string, format: date-time }
        - name: min_distance_m
          in: query
          schema: { type: number }
        - name: max_distance_m
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Activity page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/activities/summary:
    get:
      tags: [activities]
      parameters:
        - name: year
          in: query
          schema: { type: string }
        - name: sport
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Activity summary aggregates (totals, by year/month/sport).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySummary"
  /api/v1/activities/routes:
    get:
      tags: [activities]
      responses:
        "200":
          description: Trimmed, privacy-masked GeoJSON route collection for every activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteFeatureCollection"
  /api/v1/activities/{activityId}:
    get:
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Activity detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/activities/{activityId}/route:
    get:
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Ordered route points.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoutePoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/activities/{activityId}/samplings:
    get:
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Activity sampling records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sampling"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/activities/{activityId}/laps:
    get:
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Activity laps.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sleep:
    get:
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Sleep session page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sleep/aggregates:
    get:
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/Granularity"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Sleep aggregate buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepAggregateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sleep/{sleepId}:
    get:
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/SleepId"
      responses:
        "200":
          description: Sleep session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sleep"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sleep/{sleepId}/segments:
    get:
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/SleepId"
      responses:
        "200":
          description: Sleep stage segments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SleepSegment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/daily:
    get:
      tags: [daily]
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Daily summary page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/daily/aggregates:
    get:
      tags: [daily]
      parameters:
        - $ref: "#/components/parameters/Granularity"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Daily aggregate buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyAggregateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/reports/monthly:
    get:
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/Timezone"
      responses:
        "200":
          description: Synchronous typed monthly report over all private canonical domains.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/reports/monthly-series:
    get:
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/ReportEndMonth"
        - $ref: "#/components/parameters/ReportSeriesMonths"
        - $ref: "#/components/parameters/Timezone"
      responses:
        "200":
          description: Server-aggregated monthly reports with empty months omitted from the trend points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReportSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/expenses:
    get:
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: currency
          in: query
          schema:
            type: string
            enum: [JPY, USD, EUR, GBP]
        - name: category
          in: query
          schema:
            type: string
            enum:
              [
                food,
                groceries,
                transport,
                shopping,
                housing,
                utilities,
                health,
                entertainment,
                subscriptions,
                work,
                other,
              ]
      responses:
        "200":
          description: Active expense page ordered by occurred date descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [expenses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpense"
      responses:
        "201":
          description: Expense created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "200":
          description: Idempotent retry returned the existing expense.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
  /api/v1/expenses/{expenseId}:
    get:
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "200":
          description: Expense record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
    put:
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceExpense"
      responses:
        "200":
          description: Expense replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
    delete:
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "204":
          description: Expense tombstone recorded; repeat deletes are also successful.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/media:
    get:
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema: { type: string }
        - name: media_type
          in: query
          schema: { type: string }
        - name: family
          in: query
          schema: { type: string }
        - name: completed_year
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Media library page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/media/sync/{connectorId}:
    post:
      tags: [media]
      summary: Queue a configured media connector sync.
      description: |
        Queues a sync for a connector configured by the deployment. Credentials
        are resolved by the worker environment and are never accepted in this
        request body. The pre-release API currently supports `anilist` and
        `bangumi`.
      parameters:
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
            enum: [anilist, bangumi]
      responses:
        "202":
          description: Sync job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Job dispatcher is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/media/events:
    get:
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Media event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/media/aggregates:
    get:
      tags: [media]
      responses:
        "200":
          description: Media aggregate data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAggregates"
  /api/v1/media/{mediaId}:
    get:
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Media detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/media/resolution-tasks:
    get:
      tags: [media]
      summary: List the media cross-provider resolution inbox.
      description: |
        Dedupe-candidate and progress-conflict tasks the media resolver
        (apps/iroha-imports) writes when it cannot auto-resolve a synced
        item. Defaults to open tasks only.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, dismissed] }
      responses:
        "200":
          description: Media resolution tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaResolutionTask"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/media/resolution-tasks/{taskId}:
    patch:
      tags: [media]
      summary: Record the operator's decision on a resolution task.
      description: |
        Closes an open task as resolved or dismissed. This only records the
        decision in resolution_json for a future consumer to act on -- it
        does not merge media rows or apply a progress choice.
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [resolved, dismissed] }
                resolution: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Updated resolution task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaResolutionTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tasks:
    get:
      tags: [control-room]
      summary: List personal control-room tasks.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { type: string, enum: [open, completed, canceled] }
        - name: due
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Personal tasks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [control-room]
      summary: Create a personal control-room task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/tasks/{taskId}:
    patch:
      tags: [control-room]
      summary: Complete or cancel a personal task.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [completed, canceled] }
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs:
    get:
      tags: [control-room]
      summary: List durable system jobs.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: kind
          in: query
          description: Exact kind, or comma-separated kinds.
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Recent durable jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/jobs/{jobId}:
    get:
      tags: [control-room]
      summary: Read one durable system job.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Durable job detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/actions/{action}:
    post:
      tags: [control-room]
      summary: Trigger one named safe action.
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [media-sync-anilist, media-sync-bangumi]
      responses:
        "202":
          description: Action queued as a durable job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Job dispatcher is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    RawFileId:
      name: rawFileId
      in: path
      required: true
      schema: { type: string }
    ImportId:
      name: importId
      in: path
      required: true
