name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install frontend dependencies
        run: make web-install public-site-install

      - name: Run repository validation
        run: make validate
        env:
          # A push must compare with the previous tree, not its own HEAD.
          # New branches (all-zero before SHA) compare with the default branch.
          QUALITY_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before != '0000000000000000000000000000000000000000' && github.event.before || format('origin/{0}', github.event.repository.default_branch) }}

      - name: Install browser
        run: cd apps/iroha-web && mise exec -- bunx playwright install --with-deps chromium

      - name: Run browser checks
        run: make e2e

      - name: Check public serving responses
        run: |
          mkdir -p "$RUNNER_TEMP/public-site/_app/immutable"
          printf 'shell' > "$RUNNER_TEMP/public-site/index.html"
          printf 'asset' > "$RUNNER_TEMP/public-site/_app/immutable/test.js"
          docker run -d --name public-site-check -p 127.0.0.1:18080:8080 \
            -e IROHA_SERVER_UPSTREAM=127.0.0.1:1 \
            -v "$PWD/ops/images/Caddyfile.public-site:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/public-site:/srv:ro" caddy:2-alpine
          trap 'docker rm -f public-site-check' EXIT
          make public-site-response-check BASE=http://127.0.0.1:18080

  integration:
    name: PostGIS integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: iroha
          POSTGRES_PASSWORD: iroha_dev
          POSTGRES_DB: iroha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iroha -d iroha_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Run integration checks on disposable service
        run: make test-integration-ci
        env:
          DATABASE_URL: postgres://iroha:iroha_dev@127.0.0.1:5432/iroha_test?sslmode=disable
